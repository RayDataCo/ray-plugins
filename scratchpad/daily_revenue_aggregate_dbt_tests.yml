version: 2

models:
  - name: daily_revenue
    tests:
      # Aggregate-level: relative basis
      - test_sum_within_stddev_of_mean:
          column: amount
          days: 30
          stddev_threshold: 2
          config:
            severity: warn

      # Aggregate-level: temporal basis
      - test_daily_count_variance:
          variance_pct: 20
          config:
            severity: warn
