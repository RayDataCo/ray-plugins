version: 2

models:
  - name: daily_revenue
    description: Daily revenue aggregation
    columns:
      - name: amount
        description: Revenue amount in cents
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "amount >= 0"
              config:
                severity: error
      - name: date
        description: Date of revenue
        tests:
          - not_null
