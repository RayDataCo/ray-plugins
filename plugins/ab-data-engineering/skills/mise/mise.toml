# mise.toml — AB Data Engineering brigade readiness declaration.
#
# Single source of truth for "is this brigade ready to serve". Engine: mise.py
# vendored from ab-skill-factory canon (sha256
# 6a680f22ded56e74b44b544cc1d302f958b3e79dc4daf52d85def8a65cbd3774, 2026-07-09),
# zero pip deps. Relative targets resolve against this file's own directory.
#
# Credentials: NONE yet — pipeline-failure-triage is pure reasoning over supplied
# incident facts. This is the brigade slated to gain a warehouse connector
# (Snowflake) next; when it does, add an executor="agent" reachability check here.
# That is the moment mise stops being a pack-integrity check and becomes the
# load-bearing "does this work in YOUR environment" onboarding gate.

[roots]
# The rail/cellar ports read from the CELLAR_ROOT env var — the same var the
# runtime resolves at walk time. Unset in a public-pack install: the port
# checks below report unconfigured-with-remedy (WARN) and fire-only is the
# honest mode. Set CELLAR_ROOT (house deployment) and they check for real.
rail   = "${CELLAR_ROOT}/rail"
cellar = "${CELLAR_ROOT}"

# --- Stations present ---

[[checks]]
id          = "station-pipeline-failure-triage"
description = "Station present: pipeline-failure-triage (the one live eval-proven DE skill)"
executor    = "script"
type        = "path_exists"
target      = "../pipeline-failure-triage/SKILL.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — the pipeline-failure-triage station is missing; the brigade has no live station"

# --- Deciding agent + roster present ---

[[checks]]
id          = "expo-present"
description = "Expo present: the composing coordinator"
executor    = "script"
type        = "path_exists"
target      = "../expo/SKILL.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — expo is missing"

[[checks]]
id          = "menu-present"
description = "Menu present: the station roster + honest per-task status the expo reads"
executor    = "script"
type        = "path_exists"
target      = "../../MENU.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — MENU.md is missing; the expo has no roster to route against"

[[checks]]
id          = "manifest-parses"
description = "Plugin manifest is valid JSON"
executor    = "script"
type        = "file_parses_json"
target      = "../../.claude-plugin/plugin.json"
severity    = "FAIL"
remedy      = "plugin.json is malformed — reinstall the plugin"

# --- The rail half: walk driver + vendored adapter (symmetry guarantee, 2026-07-10) ---

[[checks]]
id          = "walk-driver-present"
description = "Walk driver present: skills/service/discipline-rail-walk.run.js (the rail half — without it the brigade cannot go in service on a rail)"
executor    = "script"
type        = "path_exists"
target      = "../service/discipline-rail-walk.run.js"
severity    = "FAIL"
remedy      = "reinstall the plugin — the vendored discipline walk driver is missing; the rail half of the symmetric surface is gone"

[[checks]]
id          = "walk-driver-syntax"
description = "../service/discipline-rail-walk.run.js parses as valid JS (node --check)"
executor    = "script"
type        = "node_syntax"
target      = "../service/discipline-rail-walk.run.js"
severity    = "WARN"
remedy      = "fix the syntax error `node --check` reports in skills/service/discipline-rail-walk.run.js; if node is absent this check cannot run (see node-on-path)"

[[checks]]
id          = "node-on-path"
description = "node is on PATH — lint-time only, for `node --check` on the walk driver; the walk itself runs via the harness Workflow tool, not node"
executor    = "script"
type        = "command_on_path"
target      = "node"
severity    = "WARN"
remedy      = "install node (e.g. `brew install node`) — only needed to lint-check discipline-rail-walk.run.js; the walk runtime does not require it"

[[checks]]
id          = "workflow-tool-callable"
description = "The Claude Code session has the Workflow tool available — discipline-rail-walk.run.js is a Workflow script, not a node script; the rail path cannot execute without it (fire path unaffected)"
executor    = "agent"
type        = "workflow_tool_callable"
target      = "Workflow tool (harness-provided)"
severity    = "WARN"
remedy      = "confirm the session's tool config includes the Workflow tool before walking a rail; without it the brigade serves fire-only"

[[checks]]
id          = "python3-on-path"
description = "python3 is on PATH — the walk driver's agent() calls shell to the vendored adapter CLI (skills/service/vendor/rail_adapter.py) for every rail read/mutation (rail path only)"
executor    = "script"
type        = "command_on_path"
target      = "python3"
severity    = "WARN"
remedy      = "install python3 — only the rail path needs it; the fire path serves without it"

# --- Vendoring: both vendored files match their stamps (ADAPTER-SPEC.md's vendoring procedure) ---

[[checks]]
id           = "rail-adapter-vendor-stamp"
description  = "skills/service/vendor/rail_adapter.py matches its .stamp.json (no drift from canon, no hand-edit)"
executor     = "script"
type         = "vendor_stamp"
target       = "../service/vendor/rail_adapter.py"
stamp_target = "../service/vendor/rail_adapter.py.stamp.json"
severity     = "FAIL"
remedy       = "re-vendor from ab-skill-factory/adapter/rail_adapter.py and re-stamp — never hand-edit the vendored copy"

[[checks]]
id           = "walk-driver-vendor-stamp"
description  = "skills/service/discipline-rail-walk.run.js matches its .stamp.json (no drift from canon, no hand-edit)"
executor     = "script"
type         = "vendor_stamp"
target       = "../service/discipline-rail-walk.run.js"
stamp_target = "../service/discipline-rail-walk.run.js.stamp.json"
severity     = "FAIL"
remedy       = "re-vendor from ab-skill-factory/skills/service/discipline-rail-walk.run.js and re-stamp — never hand-edit the vendored copy"

# --- Ports: rail + cellar (WARN — unconfigured is fire-only, not broken) ---

[[checks]]
id          = "rail-root-exists"
description = "Rail root exists — tickets live and travel here (rail path only; unwired = fire-only mode)"
executor    = "script"
type        = "path_exists"
target      = "{rail}"
severity    = "WARN"
remedy      = "set CELLAR_ROOT to your cellar path, then mkdir -p {rail} — until then the brigade serves fire-only"

[[checks]]
id          = "rail-root-writable"
description = "Rail root is writable — enqueue/pull/append/ack all write here (rail path only)"
executor    = "script"
type        = "path_writable"
target      = "{rail}"
severity    = "WARN"
remedy      = "fix permissions on {rail} (chmod/chown) — the walk cannot lease or ack tickets on a read-only rail"

[[checks]]
id          = "cellar-root-exists"
description = "Cellar root exists — answers land and the menu publishes here (rail path only; unwired = fire-only mode)"
executor    = "script"
type        = "path_exists"
target      = "{cellar}"
severity    = "WARN"
remedy      = "set CELLAR_ROOT to your cellar path, then mkdir -p {cellar} — until then the brigade serves fire-only, answers in-session"

[[checks]]
id          = "cellar-root-writable"
description = "Cellar root is writable — the walk lands answer artifacts and files closed tickets here (rail path only)"
executor    = "script"
type        = "path_writable"
target      = "{cellar}"
severity    = "WARN"
remedy      = "fix permissions on {cellar} (chmod/chown) — closed tickets and answers cannot land on a read-only cellar"

# --- Walk port (WALK-SPEC.md, 2026-07-11 convergence) ---

[[checks]]
id          = "walk-reference-vendor-stamp"
description = "skills/service/vendor/walk.py (the walk port's Python REFERENCE adapter) matches its .stamp.json — vendored and fresh; this brigade's default driver is the harness-native Workflow adapter, the reference is what it is measured against"
executor    = "script"
type        = "vendor_stamp"
target      = "../service/vendor/walk.py"
stamp_target = "../service/vendor/walk.py.stamp.json"
severity    = "FAIL"
remedy      = "re-vendor from ab-skill-factory/adapter/walk.py and re-stamp — never hand-edit the vendored copy"
