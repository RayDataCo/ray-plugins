# mise.toml — AB Legal brigade readiness declaration.
#
# Single source of truth for "is this brigade ready to serve". Engine: mise.py
# vendored from ab-skill-factory canon, zero pip deps. Relative targets resolve
# against this file's own directory (skills/mise/), so the pack is portable.
#
# Credentials: NONE. These are structural document-review skills — no external
# API calls, no MCP servers, no connectors. (A legal brigade that later gained a
# contract-repository or e-signature connector would add an executor="agent"
# reachability check here.)

[roots]
# Rail + cellar resolve from the CELLAR_ROOT env var — the same var the runtime
# resolves. Unset, the placeholder stays literal and the port checks report
# unconfigured (WARN) with the remedy naming what to set: fire-only mode.
rail   = "${CELLAR_ROOT}/rail"
cellar = "${CELLAR_ROOT}"

# --- Stations present: every live station the expo can compose ---

[[checks]]
id          = "station-regulatory-notice-coverage"
description = "Station present: regulatory-notice-coverage"
executor    = "script"
type        = "path_exists"
target      = "../regulatory-notice-coverage/SKILL.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — regulatory-notice-coverage station is missing"

[[checks]]
id          = "station-contract-clause-coverage"
description = "Station present: contract-clause-coverage"
executor    = "script"
type        = "path_exists"
target      = "../contract-clause-coverage/SKILL.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — contract-clause-coverage station is missing"

# --- Deciding agent + roster present ---

[[checks]]
id          = "expo-present"
description = "Expo present: the composing coordinator"
executor    = "script"
type        = "path_exists"
target      = "../expo/SKILL.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — expo is missing; the brigade cannot compose stations"

[[checks]]
id          = "menu-present"
description = "Menu present: the station roster the expo reads"
executor    = "script"
type        = "path_exists"
target      = "../../MENU.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — MENU.md is missing"

[[checks]]
id          = "manifest-parses"
description = "Plugin manifest is valid JSON"
executor    = "script"
type        = "file_parses_json"
target      = "../../.claude-plugin/plugin.json"
severity    = "FAIL"
remedy      = "plugin.json is malformed — reinstall the plugin"

# --- Rail half: vendored walk driver + adapter (symmetry guarantee) ---

[[checks]]
id          = "walk-driver-present"
description = "Walk driver present: skills/service/discipline-rail-walk.run.js — the rail half's vendored canon driver"
executor    = "script"
type        = "path_exists"
target      = "../service/discipline-rail-walk.run.js"
severity    = "FAIL"
remedy      = "re-vendor from ab-skill-factory/skills/service/discipline-rail-walk.run.js and re-stamp — a discipline brigade without its walk is interface-incomplete"

[[checks]]
id          = "walk-driver-parses"
description = "Walk driver parses: node --check on discipline-rail-walk.run.js (lint-time only — the driver runs via the harness Workflow tool, not node; node absent reports WARN, not broken-brigade)"
executor    = "script"
type        = "node_syntax"
target      = "../service/discipline-rail-walk.run.js"
severity    = "WARN"
remedy      = "install node for the lint-time syntax check, or on a real syntax error re-vendor from canon — never hand-edit the vendored copy"

[[checks]]
id          = "rail-adapter-vendor-stamp"
description = "skills/service/vendor/rail_adapter.py matches its .stamp.json (no drift from canon, no hand-edit)"
executor    = "script"
type        = "vendor_stamp"
target      = "../service/vendor/rail_adapter.py"
stamp_target = "../service/vendor/rail_adapter.py.stamp.json"
severity    = "FAIL"
remedy      = "re-vendor from ab-skill-factory/adapter/rail_adapter.py and re-stamp — never hand-edit the vendored copy"

[[checks]]
id          = "walk-driver-vendor-stamp"
description = "skills/service/discipline-rail-walk.run.js matches its .stamp.json (no drift from canon, no hand-edit)"
executor    = "script"
type        = "vendor_stamp"
target      = "../service/discipline-rail-walk.run.js"
stamp_target = "../service/discipline-rail-walk.run.js.stamp.json"
severity    = "FAIL"
remedy      = "re-vendor from ab-skill-factory/skills/service/discipline-rail-walk.run.js and re-stamp — never hand-edit the vendored copy"

# --- Ports: rail + cellar (WARN — unwired means fire-only mode, not broken) ---

[[checks]]
id          = "rail-root-exists"
description = "Rail root exists — tickets live and travel here (rail path only)"
executor    = "script"
type        = "path_exists"
target      = "{rail}"
severity    = "WARN"
remedy      = "set CELLAR_ROOT to your cellar path, then mkdir -p {rail} — until then the brigade serves fire-only (requests straight to the expo)"

[[checks]]
id          = "rail-root-writable"
description = "Rail root is writable — pull/lease/append/ack all write here (rail path only)"
executor    = "script"
type        = "path_writable"
target      = "{rail}"
severity    = "WARN"
remedy      = "fix permissions on {rail} (chmod/chown) — the walk cannot lease or ack tickets on a read-only rail"

[[checks]]
id          = "cellar-root-exists"
description = "Cellar root exists — composed answers land here (rail path only)"
executor    = "script"
type        = "path_exists"
target      = "{cellar}"
severity    = "WARN"
remedy      = "set CELLAR_ROOT to your cellar path, then mkdir -p {cellar} — until then the brigade serves fire-only (answers stay in-session)"

[[checks]]
id          = "cellar-root-writable"
description = "Cellar root is writable — the walk files answers and closed tickets here (rail path only)"
executor    = "script"
type        = "path_writable"
target      = "{cellar}"
severity    = "WARN"
remedy      = "fix permissions on {cellar} (chmod/chown) — composed answers cannot land on a read-only cellar"
