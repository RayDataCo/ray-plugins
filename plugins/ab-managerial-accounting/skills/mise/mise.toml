# --- Deciding agent + roster present ---

[[checks]]
id          = "expo-present"
description = "Expo present: the composing coordinator"
executor    = "script"
type        = "path_exists"
target      = "../expo/SKILL.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — expo is missing; the brigade cannot compose stations"

[[checks]]
id          = "menu-present"
description = "Menu present: the station roster the expo reads"
executor    = "script"
type        = "path_exists"
target      = "../../MENU.md"
severity    = "FAIL"
remedy      = "reinstall the plugin — MENU.md is missing; the expo has no roster to route against"

[[checks]]
id          = "base-model-covered-present"
description = "Base-model-covered registry present (coverage claims + exemplar prompts)"
executor    = "script"
type        = "path_exists"
target      = "../../base-model-covered/README.md"
severity    = "WARN"
remedy      = "base-model-covered registry missing — coverage claims for no-skill tasks unavailable; reinstall to restore"

[[checks]]
id          = "manifest-parses"
description = "Plugin manifest is valid JSON"
executor    = "script"
type        = "file_parses_json"
target      = "../../.claude-plugin/plugin.json"
severity    = "FAIL"
remedy      = "plugin.json is malformed — reinstall the plugin"

# --- Rail half present (symmetry guarantee, AGENT-BRIGADE-STANDARD 2026-07-10):
# a kitchen brigade without its walk is interface-incomplete — a missing
# vendored file is pack damage (reinstall), not deployment posture ---

[[checks]]
id          = "walk-driver-present"
description = "Walk driver present: skills/service/discipline-rail-walk.run.js (vendored canon)"
executor    = "script"
type        = "path_exists"
target      = "../service/discipline-rail-walk.run.js"
severity    = "FAIL"
remedy      = "reinstall the plugin — the rail-walk driver is missing; the brigade's rail half is gone and the pack is interface-incomplete"

[[checks]]
id          = "rail-adapter-present"
description = "Rail adapter present: skills/service/vendor/rail_adapter.py (vendored canon)"
executor    = "script"
type        = "path_exists"
target      = "../service/vendor/rail_adapter.py"
severity    = "FAIL"
remedy      = "reinstall the plugin — the vendored rail adapter is missing; the walk driver has nothing to shell rail mutations through"

[[checks]]
id          = "node-on-path"
description = "node is on PATH — lint-time only, for `node --check` on the walk driver; the walk itself runs via the harness Workflow tool, not node"
executor    = "script"
type        = "command_on_path"
target      = "node"
severity    = "WARN"
remedy      = "install node (e.g. `brew install node`) — only needed to lint-check discipline-rail-walk.run.js; the walk runtime does not require it"

[[checks]]
id          = "walk-driver-syntax"
description = "../service/discipline-rail-walk.run.js parses as valid JS (node --check)"
executor    = "script"
type        = "node_syntax"
target      = "../service/discipline-rail-walk.run.js"
severity    = "WARN"
remedy      = "fix the syntax error `node --check` reports in skills/service/discipline-rail-walk.run.js; if node is absent this check cannot run (see node-on-path)"

# --- Vendored-from-canon drift (ADAPTER-SPEC / BRIGADE-INTERFACE "Adapter distribution") ---

[[checks]]
id           = "rail-adapter-vendor-stamp"
description  = "skills/service/vendor/rail_adapter.py matches its vendoring stamp — no drift from canon, no hand-edit"
executor     = "script"
type         = "vendor_stamp"
target       = "../service/vendor/rail_adapter.py"
stamp_target = "../service/vendor/rail_adapter.py.stamp.json"
severity     = "FAIL"
remedy       = "re-vendor: copy ab-skill-factory/adapter/rail_adapter.py over the vendored copy verbatim and re-run its stamp subcommand — never hand-edit the vendored file"

[[checks]]
id           = "walk-driver-vendor-stamp"
description  = "skills/service/discipline-rail-walk.run.js matches its vendoring stamp — no drift from canon, no hand-edit (per-brigade variance arrives via args, never edits)"
executor     = "script"
type         = "vendor_stamp"
target       = "../service/discipline-rail-walk.run.js"
stamp_target = "../service/discipline-rail-walk.run.js.stamp.json"
severity     = "FAIL"
remedy       = "re-vendor: copy ab-skill-factory/skills/service/discipline-rail-walk.run.js over the vendored copy verbatim and re-stamp — never hand-edit the vendored file"

# --- Ports: rail + cellar (WARN, not FAIL — this brigade's primary path is
# fire, which needs neither; an unwired port means fire-only mode, and the
# remedy is configuration, not repair) ---

[[checks]]
id          = "rail-root-exists"
description = "Rail reachable: rail dir exists (tickets live and travel here — rail path only)"
executor    = "script"
type        = "path_exists"
target      = "{rail}"
severity    = "WARN"
remedy      = "set CELLAR_ROOT to your cellar path, then mkdir -p {rail} — until then the brigade serves fire-only"

[[checks]]
id          = "rail-root-writable"
description = "Rail is writable — pull/lease/append/ack all write here"
executor    = "script"
type        = "path_writable"
target      = "{rail}"
severity    = "WARN"
remedy      = "fix permissions on {rail} (chmod/chown) — the walk cannot lease or ack tickets on a read-only rail; fire path is unaffected"

[[checks]]
id          = "cellar-root-exists"
description = "Cellar reachable: CELLAR_ROOT set and the dir exists (composed answers land here — rail path only)"
executor    = "script"
type        = "path_exists"
target      = "{cellar}"
severity    = "WARN"
remedy      = "set CELLAR_ROOT to your cellar directory to land answers on disk — until then the brigade serves fire-only, in-answer"

[[checks]]
id          = "cellar-root-writable"
description = "Cellar is writable — answer artifacts and filed tickets land here"
executor    = "script"
type        = "path_writable"
target      = "{cellar}"
severity    = "WARN"
remedy      = "fix permissions on {cellar} (chmod/chown) — answers cannot land on a read-only cellar; fire path is unaffected"

# --- Walk port (WALK-SPEC.md, 2026-07-11 convergence) ---

[[checks]]
id          = "walk-reference-vendor-stamp"
description = "skills/service/vendor/walk.py (the walk port's Python REFERENCE adapter) matches its .stamp.json — vendored and fresh; this brigade's default driver is the harness-native Workflow adapter, the reference is what it is measured against"
executor    = "script"
type        = "vendor_stamp"
target      = "../service/vendor/walk.py"
stamp_target = "../service/vendor/walk.py.stamp.json"
severity    = "FAIL"
remedy      = "re-vendor from ab-skill-factory/adapter/walk.py and re-stamp — never hand-edit the vendored copy"
